[filter-local]
# 广告 CDN 静态资源（脚本已清 Banner，这里兜底防加载）
^https?:\/\/ad\.xmmnsd\.com\/ - reject
^https?:\/\/cloud\.scos\.xcdacc\.com\/ - reject
^https?:\/\/txdy\.vsamhos\.com\/ - reject

[mitm]
