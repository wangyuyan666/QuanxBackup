name: Backup Repositories

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Backup Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 1

      - name: Backup repositories
        shell: bash
        run: |
          set -u

          SUCCESS_COUNT=0
          FAILED_COUNT=0
          FAILED_REPOS=()

          backup_repo() {
            local repo_url="$1"
            local dest_dir="$2"
            local branch="${3:-}"
            local repo_name
            local temp_dir
            local stage_dir
            local old_dir

            repo_name="${repo_url#https://github.com/}"
            repo_name="${repo_name%.git}"

            temp_dir="$(mktemp -d)"
            stage_dir="${dest_dir}.new"
            old_dir="${dest_dir}.old"

            echo
            echo "============================================================"
            echo "Backing up: ${repo_name}"
            echo "Destination: ${dest_dir}"
            if [[ -n "${branch}" ]]; then
              echo "Branch: ${branch}"
            fi
            echo "============================================================"

            rm -rf "${stage_dir}" "${old_dir}"

            # Clone failure is isolated to this repository.
            if [[ -n "${branch}" ]]; then
              if ! git clone --depth=1 --single-branch --branch "${branch}" "${repo_url}" "${temp_dir}/repo"; then
                echo "::warning title=Backup failed::Failed to clone ${repo_name}. Keeping the previous backup."
                FAILED_REPOS+=("${repo_name} (clone failed)")
                FAILED_COUNT=$((FAILED_COUNT + 1))
                rm -rf "${temp_dir}" "${stage_dir}" "${old_dir}"
                return 0
              fi
            else
              if ! git clone --depth=1 "${repo_url}" "${temp_dir}/repo"; then
                echo "::warning title=Backup failed::Failed to clone ${repo_name}. Keeping the previous backup."
                FAILED_REPOS+=("${repo_name} (clone failed)")
                FAILED_COUNT=$((FAILED_COUNT + 1))
                rm -rf "${temp_dir}" "${stage_dir}" "${old_dir}"
                return 0
              fi
            fi

            # Build the replacement copy separately first.
            mkdir -p "${stage_dir}"

            if ! rsync -a --delete --exclude='.git' "${temp_dir}/repo/" "${stage_dir}/"; then
              echo "::warning title=Backup failed::Failed to prepare files for ${repo_name}. Keeping the previous backup."
              FAILED_REPOS+=("${repo_name} (copy failed)")
              FAILED_COUNT=$((FAILED_COUNT + 1))
              rm -rf "${temp_dir}" "${stage_dir}" "${old_dir}"
              return 0
            fi

            # Swap only after clone + copy are both successful.
            if [[ -e "${dest_dir}" ]]; then
              if ! mv "${dest_dir}" "${old_dir}"; then
                echo "::warning title=Backup failed::Failed to move old backup for ${repo_name}."
                FAILED_REPOS+=("${repo_name} (replace failed)")
                FAILED_COUNT=$((FAILED_COUNT + 1))
                rm -rf "${temp_dir}" "${stage_dir}" "${old_dir}"
                return 0
              fi
            fi

            if ! mv "${stage_dir}" "${dest_dir}"; then
              echo "::warning title=Backup failed::Failed to install new backup for ${repo_name}. Restoring previous backup."

              rm -rf "${dest_dir}"
              if [[ -e "${old_dir}" ]]; then
                mv "${old_dir}" "${dest_dir}" || true
              fi

              FAILED_REPOS+=("${repo_name} (replace failed)")
              FAILED_COUNT=$((FAILED_COUNT + 1))
              rm -rf "${temp_dir}" "${stage_dir}" "${old_dir}"
              return 0
            fi

            rm -rf "${old_dir}" "${temp_dir}"

            echo "Backup succeeded: ${repo_name}"
            SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            return 0
          }

          # Format:
          # backup_repo "repository URL" "destination directory" ["optional branch"]

          backup_repo "https://github.com/xiaomaoJT/QxScript" \
            "QxScript(xiaomaoJT)"

          backup_repo "https://github.com/blackmatrix7/ios_rule_script" \
            "ios_rule_script(blackmatrix7)"

          backup_repo "https://github.com/NobyDa/Script" \
            "Script(NobyDa)"

          backup_repo "https://github.com/limbopro/Adblock4limbo" \
            "Adblock4limbo(limbopro)"

          backup_repo "https://github.com/VirgilClyne/iRingo" \
            "iRingo(VirgilClyne)"

          backup_repo "https://github.com/app2smile/rules" \
            "rules(app2smile)"

          backup_repo "https://github.com/Semporia/TikTok-Unlock" \
            "TikTok-Unlock(Semporia)"

          backup_repo "https://github.com/deezertidal/QuantumultX-Rewrite" \
            "QuantumultX-Rewrite(deezertidal)"

          backup_repo "https://github.com/TributePaulWalker/Profiles" \
            "Profiles(TributePaulWalker)"

          # Disabled in your original workflow:
          # backup_repo "https://github.com/zxfccmm4/Surge" \
          #   "Surge(zxfccmm4)"

          backup_repo "https://github.com/zqzess/rule_for_quantumultX" \
            "rule_for_quantumultX(zqzess)"

          backup_repo "https://github.com/89996462/Quantumult-X" \
            "Quantumult-X(89996462)"

          backup_repo "https://github.com/ddgksf2013/ddgksf2013" \
            "ddgksf2013(ddgksf2013)"

          backup_repo "https://github.com/ddgksf2013/Profile" \
            "Profile(ddgksf2013)"

          backup_repo "https://github.com/ddgksf2013/Rewrite" \
            "Rewrite(ddgksf2013)"

          backup_repo "https://github.com/ddgksf2013/Filter" \
            "Filter(ddgksf2013)"

          backup_repo "https://github.com/ddgksf2013/Scripts" \
            "Scripts(ddgksf2013)"

          backup_repo "https://github.com/Yu9191/Rewrite" \
            "Rewrite(Yu9191)"

          backup_repo "https://github.com/Marol62926/Quantumultx" \
            "Quantumultx(Marol62926)"

          backup_repo "https://github.com/Marol62926/MarScrpt" \
            "MarScrpt(Marol62926)"

          backup_repo "https://github.com/fmz200/wool_scripts" \
            "wool_scripts(fmz200)"

          backup_repo "https://github.com/Repcz/Tool" \
            "Tool(Repcz)"

          backup_repo "https://github.com/chxm1023/Rewrite" \
            "Rewrite(chxm1023)" \
            "main"

          backup_repo "https://github.com/GeQ1an/Rules" \
            "Rules(GeQ1an)" \
            "master"

          backup_repo "https://github.com/WeiGiegie/666" \
            "666(WeiGiegie)" \
            "main"

          backup_repo "https://github.com/ZenmoFeiShi/Qx" \
            "Qx(ZenmoFeiShi)" \
            "main"

          echo
          echo "============================================================"
          echo "Backup summary"
          echo "Succeeded: ${SUCCESS_COUNT}"
          echo "Failed:    ${FAILED_COUNT}"

          if (( FAILED_COUNT > 0 )); then
            echo
            echo "Repositories with problems:"
            printf ' - %s\n' "${FAILED_REPOS[@]}"
          fi
          echo "============================================================"

          {
            echo "## Repository backup summary"
            echo
            echo "- Succeeded: ${SUCCESS_COUNT}"
            echo "- Failed: ${FAILED_COUNT}"

            if (( FAILED_COUNT > 0 )); then
              echo
              echo "### Failed repositories"
              for repo in "${FAILED_REPOS[@]}"; do
                echo "- ${repo}"
              done
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

          # Deliberately succeed even when one or more source repositories fail.
          exit 0

      - name: Update timestamp
        shell: bash
        run: |
          echo "Backup run at $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > backup-timestamp.txt

      - name: Commit and Push Changes
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Automated backup $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}"
